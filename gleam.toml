name = "mendix_widget_gleam"
version = "5.0.0"
gleam = ">= 1.17.0"
target = "javascript"
description = "Reference Mendix Pluggable Widget built with Gleam, Glendix, Mendraw, and Lustre"
licences = ["Apache-2.0"]
repository = { type = "github", user = "glendix-labs", repo = "MendixWidgetGleam" }

[javascript]
typescript_declarations = false
runtime = "bun"

[tools.glendix]
pm = "bun"
compatibility = "experimental-native"

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
glendix = ">= 5.1.0 and < 6.0.0"
mendraw = ">= 2.0.0 and < 3.0.0"
redraw = ">= 19.2.2 and < 20.0.0"
redraw_dom = ">= 19.2.2 and < 20.0.0"
lustre = ">= 5.7.1 and < 6.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
